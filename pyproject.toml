[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uploadkit"
version = "0.1.0"
description = "Framework-independent secure upload pipeline for Python"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "UploadKit" }]
keywords = ["upload", "validation", "storage", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "coverage>=7.0"]

[project.urls]
Homepage = "https://github.com/uploadkit/uploadkit"
Documentation = "https://github.com/uploadkit/uploadkit"
Repository = "https://github.com/uploadkit/uploadkit"

[tool.hatch.build.targets.wheel]
packages = ["src/uploadkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
